name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to the v4.2.2 release commit.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Pinned to the v4.4.0 release commit.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node --test
      - name: Validate the built in scenarios
        run: node bin/injection-gauntlet.js validate
      - name: Calibration run against the gullible example agent
        run: node bin/injection-gauntlet.js run --quiet -- node examples/agents/gullible-agent.js
